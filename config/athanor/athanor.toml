[place]
# Without this, the planetary hours assume sunrise at 6:00 and sunset at 18:00.
# latitude = 40.71
# longitude = -74.01

[character]
# name defaults to your login name and race to your distro.
# name = "Prospero"
title = "the Wizard"
# race = "Arch Linux"

[room]
name = "A Dim Chamber"
description = "Dust hangs in the lamplight. A terminal hums on the desk."

[room.exits]
# Listed under the room as its obvious exits.
# north = "~/projects"
# down = "~/notes"

[display]
# Screen pixels per wallpaper pixel. 0 picks 2 (3 at 4K).
pixel_scale = 0
# tandy, terminus, cozette, compaq, vga or mek. Applies at the next transmute.
terminal_font = "tandy"
# Draw folder, file and toolbar icons in the scheme's colours, in the font's line.
icons = true
# Give apps a ring with a sign or their initial too. Needs icons = true.
app_icons = true
# Theme GTK apps (the file manager, file pickers) in the scheme, with Vellum and
# square corners.
gtk = true

[folders]
# Give a folder one of the signs: sol, recipe, water, mercury, eye, fire,
# ouroboros, caput or bindu. Home, Documents, Downloads, Music, Pictures and
# the trash have theirs already.
# "~/projects" = "fire"

[folder_signs]
# Every folder directly inside these gets a sign in its seal. A word in its name
# can call for one (music, photos, notes, farm and so on); otherwise it gets a
# bija or a glyph picked from its name. Remove a path to give its folders the
# plain bindu again.
inside = ["~"]

[folder_signs.words]
# Your own words, tried before Athanor's. A word may use * as a wildcard.
# "rec*" = "recipe"

[transmute]
# Change scheme with the time of day: umber at night, then vellum, orpiment
# and cinnabar through the daylight hours.
stages = false

[tarot]
on_login = true

[boot]
# The scheme `athanor boot` paints the bootloader, splash, console and greeter in.
scheme = "umber"
# Log in straight after the disk is unlocked, so the passphrase is the only
# password at boot. Logging out still shows the greeter.
autologin = false
