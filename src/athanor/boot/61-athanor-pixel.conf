<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Athanor's boot screens (athanor-system): Ossuary and Vellum are pixel faces
     drawn on a grid, so antialiasing only adds grey fringes. Installed for the
     greeter user, who can't read your own fontconfig. -->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains"><string>Ossuary</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Vellum</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
