# Icons in the Athanor font's line. Folders are a seal (a circle in a square), files a
# tablet with a folded corner. Each has a sign at the centre, in the font's own pixels
# (16 px em, rendered by FreeType).
# Any sign can mark a folder through [folders] in athanor.toml.
#
# The [[folder]] and [[file]] rules are tried in order. Each pattern is matched
# against the icon names of the theme Athanor's icons inherit, so a file type the
# theme draws gets a tablet too. Names without wildcards are always drawn.

