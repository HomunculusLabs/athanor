[[folder]]
sign = "sol"
match = [
  "user-home", "folder-home",
]

[[folder]]
sign = "recipe"
match = [
  "folder-documents",
]

[[folder]]
sign = "water"
match = [
  "folder-download",
]

[[folder]]
sign = "mercury"
match = [
  "folder-music",
]

[[folder]]
sign = "eye"
match = [
  "folder-pictures",
]

[[folder]]
sign = "caput"
match = [
  "user-trash", "user-trash-full",
]

[[folder]]
sign = "bindu"
match = [
  "folder", "inode-directory", "folder-open", "folder-drag-accept", "folder-videos",
  "folder-templates", "folder-publicshare", "folder-remote", "user-desktop", "folder-*",
]

[[file]]
sign = "heaven"
match = [
  "text", "text-plain", "text-x-plain", "text-x-generic", "text-markdown", "text-x-readme",
  "text-x-log", "text-x-authors", "text-x-credits", "text-x-copying", "text-x-install",
  "text-x-preview", "message-rfc822",
]

[[file]]
sign = "recipe"
match = [
  "*epub*", "*ebook*", "image-vnd.djvu", "*pdf*",
]

[[file]]
sign = "earth"
match = [
  "*spreadsheet*", "*sheet*", "*calc*", "*excel*", "text-csv", "*database*", "*access",
  "application-x-sqlite3", "libreoffice-formula*", "*opendocument.formula*", "*oasis-formula*",
]

[[file]]
sign = "globe"
match = [
  "*html*", "*opendocument.web*", "*oasis-web*", "libreoffice-web", "application-x-rss+xml",
  "application-x-mswinurl",
]

[[file]]
sign = "letter"
match = [
  "font*", "application-font", "application-x-font*",
]

[[file]]
sign = "mercury"
match = [
  "audio-*", "application-x-audacity*", "application-x-lmms*", "application-x-musescore*",
  "text-x-lilypond", "*Melody",
]

[[file]]
sign = "moon"
match = [
  "video-*", "application-x-subrip", "application-x-sami", "text-x-microdvd",
]

[[file]]
sign = "saturn"
match = [
  "*cd-image", "*disk-image", "*diskimage", "application-x-qemu-disk",
  "application-x-virtualbox-*", "application-vnd.squashfs", "*-rom", "rom",
]

[[file]]
sign = "salt"
match = [
  "package*", "gnome-package", "*zip*", "*rar", "*7z*", "*gzip", "*compress", "*archive*",
  "*tar", "application-vnd.debian.binary-package", "application-vnd.flatpak",
  "application-vnd.snap", "application-apk", "application-x-msi", "application-x-xpinstall",
  "*extension*", "application-x-addon", "application-x-bittorrent",
]

[[file]]
sign = "eye"
match = [
  "image-*", "application-photoshop", "application-illustrator", "application-x-krita",
  "application-x-blender", "*eps", "application-postscript", "*graphics*", "*drawing*",
  "application-x-xop*", "model*",
]

[[file]]
sign = "recipe"
match = [
  "*document*", "document", "*msword", "*ms-word", "*opendocument*", "libreoffice-*",
  "*presentation*", "*powerpoint", "*slideshow", "application-rtf",
  "application-vnd.ms-publisher", "*hwp", "text-x-tex", "text-vnd.typst", "office-*",
  "text-enriched", "text-richtext",
]

[[file]]
sign = "mars"
match = [
  "application-x-executable", "application-x-ms-dos-executable", "*portable-executable",
  "application-x-msdownload", "application-x-sharedlib", "application-x-desktop",
  "application-x-firmware", "org.gnome.Firmware",
]

[[file]]
sign = "sulphur"
match = [
  "text-x-*", "text-*", "application-x-shellscript", "application-*javascript",
  "application-*typescript", "application-json", "application-*+json", "application-toml",
  "application-*yaml", "application-xml", "application-sql", "application-*java",
  "application-x-perl", "application-x-php", "application-x-ruby",
  "application-x-python-bytecode", "application-vnd-dart", "gnome-mime-text-x-makefile",
]

[[file]]
sign = "bindu"
match = [
  "unknown", "application-octet-stream", "*",
]

