# Generated by athanor transmute ({{ label }}). Edits are overwritten.
[main]
font=Vellum:pixelsize=36
prompt="@ "
terminal=foot -e
icons-enabled=yes
icon-theme=athanor-icons
width=48
lines=12
horizontal-pad=24
vertical-pad=16
inner-pad=8
# In points: 48 pt is 64 px, twice the icons' 32 px grid, so they stay crisp.
line-height=48
image-size-ratio=0

[colors]
background={{ bg.rgba }}
text={{ fg.rgba }}
prompt={{ active.rgba }}
input={{ fg.rgba }}
match={{ active.rgba }}
selection={{ fg.rgba }}
selection-text={{ bg.rgba }}
selection-match={{ a1.rgba }}
border={{ active.rgba }}

[border]
width=2
radius=0
