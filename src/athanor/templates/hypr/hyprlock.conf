# Generated by athanor transmute ({{ label }}). Edits are overwritten.

general {
    hide_cursor = true
}

background {
    monitor =
    path = {{ wall_lock }}
    color = rgb({{ bg.hex }})
}

image {
    monitor =
    path = {{ sigil }}
    size = 88
    rounding = 0
    border_size = 0
    position = {{ lock_x }}, -72
    halign = left
    valign = top
}

label {
    monitor =
    text = {{ host }}
    color = rgb({{ fg.hex }})
    font_family = Vellum
    font_size = 18
    position = {{ beside_x }}, -92
    halign = left
    valign = top
}

label {
    monitor =
    text = {{ fingerprint_short }}
    color = rgb({{ dim.hex }})
    font_family = Vellum
    font_size = 18
    position = {{ beside_x }}, -124
    halign = left
    valign = top
}

label {
    monitor =
    text = $TIME
    color = rgb({{ fg.hex }})
    # Ossuary Display is drawn for 32px: 144pt is 192px, six
    # times over, so every pixel of the textura lands on the grid. Vellum, the
    # labels' book hand, is a 12px em: 18pt is 24px.
    font_family = Ossuary Display
    font_size = 144
    position = {{ lock_x }}, -210
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] {{ bin }} hour --lock {{ fg.hex }},{{ active.hex }},{{ dim.hex }}
    color = rgb({{ fg.hex }})
    font_family = Vellum
    font_size = 18
    position = {{ lock_x }}, -456
    halign = left
    valign = top
}

image {
    monitor =
    path = {{ card_png }}
    reload_cmd = {{ bin }} draw --png
    reload_time = 600
    size = {{ card_w }}
    rounding = 0
    border_size = 0
    position = -72, 0
    halign = right
    valign = center
}

label {
    monitor =
    text = @ {{ name }}, speak the word:
    color = rgb({{ fg.hex }})
    font_family = Vellum
    font_size = 18
    position = {{ lock_x }}, 168
    halign = left
    valign = bottom
}

input-field {
    monitor =
    size = {{ text_w }}, 44
    outline_thickness = 2
    rounding = 0
    outer_color = rgb({{ active.hex }})
    inner_color = rgb({{ bg.hex }})
    font_color = rgb({{ fg.hex }})
    font_family = Vellum
    check_color = rgb({{ a6.hex }})
    fail_color = rgb({{ a1.hex }})
    capslock_color = rgb({{ a3.hex }})
    fail_text = The word is wrong. ($ATTEMPTS)
    placeholder_text =
    fade_on_empty = false
    dots_size = 0.2
    dots_spacing = 0.4
    dots_rounding = 0
    position = {{ lock_x }}, 108
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] {{ bin }} status --short
    color = rgb({{ dim.hex }})
    font_family = Vellum
    font_size = 18
    position = {{ lock_x }}, 64
    halign = left
    valign = bottom
}
